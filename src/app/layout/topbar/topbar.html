<a class="brand" routerLink="/" aria-label="FinanzasHub, ir a Inicio">
  <app-brand-mark />
  <span class="brand-text">
    <span class="name">FinanzasHub</span>
  </span>
</a>

@if (workspaces.workspaces().length > 0) {
  <label class="workspace">
    <span class="sr-only">Espacio para metas y gastos compartidos</span>
    <app-icon name="workspaces" [size]="18" />
    <select [value]="workspaces.current()?.id" (change)="switchWorkspace($any($event.target).value)">
      @for (workspace of workspaces.workspaces(); track workspace.id) {
        <option [value]="workspace.id" [selected]="workspace.id === workspaces.current()?.id">{{ label(workspace) }}</option>
      }
    </select>
  </label>
}

<div class="spacer"></div>

<app-search />

<div class="month" role="group" aria-label="Mes seleccionado">
  <button type="button" class="step" aria-label="Mes anterior" (click)="period.previous()">
    <app-icon name="chevron_left" [size]="18" />
  </button>
  <span class="picker">
    <button type="button" class="picker-label" aria-live="polite" [attr.aria-label]="period.label() + '. Elegir otro mes'" (click)="openPicker(monthInput)">
      {{ period.label() }}
    </button>
    <input #monthInput type="month" tabindex="-1" aria-hidden="true" [value]="period.isoMonth()" (change)="period.select(monthInput.value)" />
  </span>
  <button type="button" class="step" aria-label="Mes siguiente" (click)="period.next()">
    <app-icon name="chevron_right" [size]="18" />
  </button>
  @if (!period.isCurrent()) {
    <button type="button" class="today" aria-label="Volver al mes actual" (click)="period.goToCurrent()">Hoy</button>
  }
</div>

<button
  type="button"
  class="icon-button"
  aria-label="Ocultar saldos"
  title="Oculta los montos en pantalla, por si alguien más la ve"
  [attr.aria-pressed]="privacy.amountsHidden()"
  (click)="privacy.toggle()"
>
  <app-icon [name]="privacy.amountsHidden() ? 'visibility_off' : 'visibility'" [size]="19" />
</button>

<button
  type="button"
  class="icon-button"
  [attr.aria-label]="theme.isDark() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
  (click)="theme.toggle()"
>
  <app-icon [name]="theme.isDark() ? 'light_mode' : 'dark_mode'" [size]="19" />
</button>

<a class="icon-button notifications" routerLink="/notifications" [attr.aria-label]="center.unread() > 0 ? 'Notificaciones: ' + center.unread() + ' sin leer' : 'Notificaciones'">
  <app-icon name="notifications" [size]="19" />
  @if (center.unread() > 0) {
    <span class="unread" aria-hidden="true">{{ center.unread() > 99 ? '99+' : center.unread() }}</span>
  }
</a>

@if (session.user(); as user) {
  <a class="avatar" routerLink="/settings/profile" [attr.aria-label]="'Tu perfil: ' + user.displayName">{{ initials() }}</a>
  <button type="button" class="icon-button" aria-label="Cerrar sesión" (click)="signOut()">
    <app-icon name="logout" [size]="19" />
  </button>
}
