<a class="brand" routerLink="/" aria-label="FinanzasHub, ir a Inicio">
  <app-brand-mark />
  <span class="brand-text">
    <span class="name">FinanzasHub</span>
    <span class="period">{{ period.label() }}</span>
  </span>
</a>

@if (workspaces.workspaces().length > 0) {
  <label class="workspace">
    <span class="sr-only">Espacio</span>
    <app-icon name="workspaces" [size]="18" />
    <select [value]="workspaces.current()?.id" (change)="switchWorkspace($any($event.target).value)">
      @for (workspace of workspaces.workspaces(); track workspace.id) {
        <option [value]="workspace.id" [selected]="workspace.id === workspaces.current()?.id">{{ workspace.name }}</option>
      }
    </select>
  </label>
}

<div class="spacer"></div>

<div class="month" role="group" aria-label="Mes seleccionado">
  <button type="button" aria-label="Mes anterior" (click)="period.previous()">
    <app-icon name="chevron_left" [size]="18" />
  </button>
  <span aria-live="polite">{{ period.label() }}</span>
  <button type="button" aria-label="Mes siguiente" (click)="period.next()">
    <app-icon name="chevron_right" [size]="18" />
  </button>
</div>

<button
  type="button"
  class="icon-button"
  [attr.aria-label]="theme.isDark() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
  (click)="theme.toggle()"
>
  <app-icon [name]="theme.isDark() ? 'light_mode' : 'dark_mode'" [size]="19" />
</button>

<a class="icon-button notifications" routerLink="/notifications" aria-label="Notificaciones">
  <app-icon name="notifications" [size]="19" />
</a>

@if (session.user(); as user) {
  <a class="avatar" routerLink="/settings/profile" [attr.aria-label]="'Tu perfil: ' + user.displayName">{{ initials() }}</a>
  <button type="button" class="icon-button" aria-label="Cerrar sesión" (click)="signOut()">
    <app-icon name="logout" [size]="19" />
  </button>
}
